,"Marek Zawirski","Sébastien Zeitoun","Chengming Zhang","Haibin Zhang","Jin Zhang","Kunlong Zhang","Minjia Zhang","Nuda Zhang","Qinzi Zhang","Tianyi Zhang","Yan X Zhang","Changgeng Zhao","Jishen Zhao","Yuda Zhao","Chaodong Zheng","Yufan Zheng","Haoran Zhou","Hong-Sheng Zhou","Ji Zhu","Leqi Zhu","Xianbin Zhu","Isabella Ziccardi","Vassilis Zikas","Đorđe Žikelić","Goran Zuzic"],"papers":[{"a":[1029,593,785,359,2],"c":"1368","m":"Doubling pacemaker fails, so liveness stays conditional on synchronized views. Basic safety needed a new proof; Chained HotStuff is unsafe as printed, fixed by a height check. Linear complexity not checked.","s":"HotStuff","t":"HotStuff: BFT Consensus with Linearity and Responsiveness","u":"PODC2019/HotStuff/","v":"weakened","y":"2019"},{"a":[395],"c":"556","m":"The printed protocol is unsafe and not live; a deadline guard and one extra Δ repair it, proved safe, live and atomic. The strong-connectivity characterization holds.","s":"AtomicCrossChainSwaps","t":"Atomic Cross-Chain Swaps","u":"PODC2018/AtomicCrossChainSwaps/","v":"easy","y":"2018"},{"a":[467,491,672,895],"c":"330","m":"BAB properties hold; Lemma 1 fails for indirect commits, chain quality needs a round-major order, and Claim 6 needs a new robust-core argument; complexity claims not checked.","s":"AllYouNeedIsDAG","t":"All You Need is DAG","u":"PODC2021/AllYouNeedIsDAG/","v":"hard","y":"2021"},{"a":[243,516,702],"c":"249","m":"Circuit simulation and clique and cycle lower bounds hold after local repairs; the K_{ℓ,m} gadget is broken for ℓ ≠ m, and the degeneracy upper bound is proved only for connected H.","s":"CongestedCliquePower","t":"On the Power of the Congested Clique Model","u":"PODC2014/CongestedCliquePower/","v":"weakened","y":"2014"},{"a":[2,593,895],"c":"233","m":"Hard-coded 2f+1 breaks agreement for n > 3f+1, fixed by n−f; no halting rule, so total O(n²) messages unproved; Quality never proved; agreement, validity, expected O(1) views proved.","s":"VABA","t":"Asymptotically Optimal Validated Asynchronous Byzantine Agreement","u":"PODC2019/VABA/","v":"weakened","y":"2019"},{"a":[956,947,559],"c":"221","m":"Tight characterization (Theorems 1–3) and Section 6 hold; the necessity proof misuses validity, repaired by a short local-validity lemma.","s":"IterativeApproxBC","t":"Iterative Approximate Byzantine Consensus in Arbitrary Directed Graphs","u":"PODC2012/IterativeApproxBC/","v":"easy","y":"2012"},{"a":[540],"c":"178","m":"Routing in 16 and sorting in 37 rounds hold for every n; the non-square proof of Theorem 3.7 fails and needed a new virtual-node reduction, the other gaps are local.","s":"CongestedCliqueRouting","t":"Optimal Deterministic Routing and Sorting on the Congested Clique","u":"PODC2013/CongestedCliqueRouting/","v":"hard","y":"2013"},{"a":[409,992],"c":"176","m":"O(n) APSP and the diameter lower bounds hold. Algorithm 2 for S-SP computes wrong distances, so Theorem 5 is false and the (1+ε) approximations built on it are unproved.","s":"OptimalAPSP","t":"Optimal Distributed All Pairs Shortest Paths and Applications","u":"PODC2012/OptimalAPSP/","v":"weakened","y":"2012"},{"a":[658,659,783],"c":"160","m":"Figure 2 never terminates against the paper's own adversary (n = 4, t = 1), so Lemma 5 and Theorems 2 and 3 fail; BV-broadcast and safety are proved.","s":"SignatureFreeBA","t":"Signature-Free Asynchronous Byzantine Consensus with t < n/3 and O(n²) Messages","u":"PODC2014/SignatureFreeBA/","v":"lost","y":"2014"},{"a":[652,729,636],"c":"159","m":"Algorithms and round bounds hold; Theorem 3's proof needed a new argument, the worst-case family needs N − 2 rounds so the bound is not met exactly, and Corollary 2 misses 2M messages.","s":"KCoreDecomposition","t":"Distributed k-Core Decomposition","u":"PODC2011/KCoreDecomposition/","v":"hard","y":"2011"},{"a":[2,679,787,1013],"c":"137","m":"All lower bounds hold; Theorem 10's executions needed a small repair, and for f = n − 1 the bound is only ⌊n/2⌋Δ, still Θ(n). Upper bounds mostly not checked.","s":"GoodCaseLatencyBB","t":"Good-case Latency of Byzantine Broadcast: a Complete Categorization","u":"PODC2021/GoodCaseLatencyBB/","v":"easy","y":"2021"},{"a":[516,657,702],"c":"125","m":"All bounds survive: Theorem 6.8's sketch needed a new graph and walk, while Theorem 4.1, the diameter protocol's running time and Lemma 6.5 are false as printed but fixed locally.","s":"CoordinatedConsensusDynamic","t":"Coordinated Consensus in Dynamic Networks","u":"PODC2011/CoordinatedConsensusDynamic/","v":"hard","y":"2011"},{"a":[17,322,971],"c":"122","m":"AVC is exact after a one-symbol fix; the four-state lower bound is proved only for unordered interactions; the convergence-time bounds, the main claim, were not checked.","s":"ExactMajorityAVC","t":"Fast and Exact Majority in Population Protocols","u":"PODC2015/ExactMajorityAVC/","v":"weakened","y":"2015"},{"a":[233,512],"c":"108","m":"The conversion theorem and O(log n) rounding hold up to slips; Lemma 3.8 is false as printed and fixed by one clause. The O(log Δ) bound and distributed theorems were not checked.","s":"FaultTolerantSpanners","t":"Fault-Tolerant Spanners: Better and Simpler","u":"PODC2011/FaultTolerantSpanners/","v":"easy","y":"2011"},{"a":[278,502,574,861],"c":"105","m":"All bounds hold: uniform O(log^{1+ε} k) search, no O(log k), advice bound, harmonic algorithm. Proofs of Theorems 3.3, 4.1, 5.1 need local patches; degenerate formulas and Theorem 5.1's wording are slips.","s":"CollaborativeSearchPlane","t":"Collaborative Search on the Plane without Communication","u":"PODC2012/CollaborativeSearchPlane/","v":"easy","y":"2012"},{"a":[956,313],"c":"100","m":"Theorems 1–5 hold, but tightness for restricted algorithms is lost: Theorem 6's synchronous necessity has a counterexample at n = 4, d = 2, f = 1; only its sufficiency survives, with one constant fixed.","s":"ByzantineVectorConsensus","t":"Byzantine Vector Consensus in Complete Graphs","u":"PODC2013/ByzantineVectorConsensus/","v":"weakened","y":"2013"},{"a":[2,152,237,679,720,787,873],"c":"88","m":"Both lower bounds hold with repaired proofs (Theorem 13 needs n >= C + 2); Theorem 7's proof for the subquadratic protocol has a wrong step not repaired in Lean; upper bounds otherwise unchecked.","s":"CommComplexityBA","t":"Communication Complexity of Byzantine Agreement, Revisited","u":"PODC2019/CommComplexityBA/","v":"weakened","y":"2019"},{"a":[179,444,464,800],"c":"84","m":"The n > 3f lower bounds hold for n ≥ 3. The generic crash-to-Byzantine translation is unsound: a Byzantine process can replay messages addressed to others, and no repaired compiler is proved.","s":"NonEquivocationLimits","t":"On the (Limited) Power of Non-Equivocation","u":"PODC2012/NonEquivocationLimits/","v":"weakened","y":"2012"},{"a":[358,526,651,725,860],"c":"81","m":"Consensus numbers 1 and k hold, but Lemma 2's wait-freedom needed a new proof; Figure 1 needs a local fix and Figure 4 a one-term fix. Message-passing safety was not checked.","s":"CryptoConsensusNumber","t":"The Consensus Number of a Cryptocurrency","u":"PODC2019/CryptoConsensusNumber/","v":"hard","y":"2019"},{"a":[694,793,960,1018,1033],"c":"81","m":"Linearizability, memory safety and the Hindsight Lemma all hold; the Backbone Lemma as printed is false, but the weak chain that its proof gives and Theorem 7.5 uses is what was meant.","s":"HindsightLinearizability","t":"Verifying Linearizability with Hindsight","u":"PODC2010/HindsightLinearizability/","v":"slip","y":"2010"},{"a":[58,259,344],"c":"79","m":"Core O(Δ) + log* n algorithm holds. The intro's 2p + 1 bound fails, fixed by Section 3's larger q. Side variant 3AG never terminates on K₂ (unsaved). Applications not checked.","s":"LocallyIterativeColoring","t":"Locally-Iterative Distributed (Δ+1)-Coloring below Szegedy–Vishwanathan Barrier","u":"PODC2018/LocallyIterativeColoring/","v":"easy","y":"2018"},{"a":[581,604,845],"c":"78","m":"Theorem 2's reduction is false, so NP-completeness for 3 rounds is unproved and we neither prove nor refute it; the Ω(n) lower bound and Peacock's O(log n) relaxed schedules hold.","s":"LoopFreeUpdates","t":"Scheduling Loop-free Network Updates: It's Good to Relax!","u":"PODC2015/LoopFreeUpdates/","v":"weakened","y":"2015"},{"a":[39,260,654],"c":"78","m":"Theorem 12's unbounded-message bound holds with a new decoding argument; the OCC limit, Theorem 6, is unestablished because two proof steps fail, though it is not refuted.","s":"EventualConsistencyLimits","t":"Limitations of Highly-Available Eventually-Consistent Data Stores","u":"PODC2015/EventualConsistencyLimits/","v":"weakened","y":"2015"},{"a":[285,890],"c":"76","m":"Existential optimality and near-optimality in doubling metrics are proved, with only slips in proofs and definitions. Corollaries rest on cited bounds; the approximate-greedy construction of Section 5 was not checked.","s":"GreedySpanner","t":"The Greedy Spanner is Existentially Optimal","u":"PODC2016/GreedySpanner/","v":"slip","y":"2016"},{"a":[109,407,501,538,703,759,821,912,954],"c":"74","m":"Only slips: Theorem 22's third case wrongly says no solution exists ({0,3,4} is still global), Theorem 21 fails at n = 1. 3-colouring bound proved; classification and undecidability not checked.","s":"LCLGrids","t":"LCL Problems on Grids","u":"PODC2017/LCLGrids/","v":"slip","y":"2017"},{"a":[230,727,966],"c":"74","m":"Polynomial-cost rendezvous (Theorem 3.1) holds; Lemma 3.3's proof misses a case and the length estimates for Π are false, both fixed locally. Section 4 applications unchecked.","s":"AsyncRendezvousPoly","t":"How to Meet Asynchronously at Polynomial Cost","u":"PODC2013/AsyncRendezvousPoly/","v":"easy","y":"2013"},{"a":[194,757,23,179],"c":"74","m":"State-based definitions match Adya's for SER, SI, RC, RU and PSI once the model's wording is read as committed-only; the comparisons of Theorems 5-9 were not checked.","s":"SeeingIsBelieving","t":"Seeing is Believing: A Client-Centric Specification of Database Isolation","u":"PODC2017/SeeingIsBelieving/","v":"slip","y":"2017"},{"a":[109],"c":"71","m":"The forward speedup and applications hold. The converse of Theorem 1, and with it reversibility and exact complexities, is false without edge symmetry breaking. Theorem 4 is checked only in the port-numbering model.","s":"AutomaticSpeedup","t":"An Automatic Speedup Theorem for Distributed Problems","u":"PODC2019/AutomaticSpeedup/","v":"weakened","y":"2019"},{"a":[481,524,931],"c":"70","m":"HP-TestOut, FindMin and FindAny are wrong as printed, each saved by a local fix; a Markov step stays unrepaired, affecting only a constant. Message bounds and Build MST were not checked.","s":"MSTImpromptuRepair","t":"Construction and Impromptu Repair of an MST in a Distributed Network with o(m) Communication","u":"PODC2015/MSTImpromptuRepair/","v":"easy","y":"2015"},{"a":[141,378,459],"c":"68","m":"One adjustment and one round in expectation hold in the synchronous model after local repairs to the layers of S, Algorithm 2's rule 4 and several proofs; the asynchronous model was not checked.","s":"DynamicMIS","t":"Optimal Dynamic Distributed MIS","u":"PODC2016/DynamicMIS/","v":"easy","y":"2016"},{"a":[58,259],"c":"67","m":"Sections 3–4 hold up to Corollary 4.4, whose case split needed a corrected threshold. The polylogarithmic corollaries answering Linial's question (Theorem 4.5, Corollaries 4.6, 4.7) were not checked.","s":"ArbdefectiveColoring","t":"Deterministic Distributed Vertex Coloring in Polylogarithmic Time","u":"PODC2010/ArbdefectiveColoring/","v":"easy","y":"2010"},{"a":[131,242,375,745,880,1002],"c":"63","m":"ICC0's safety and deadlock freeness hold; the liveness lemma's \"finalized\" must become \"committed\", which is proved. ICC1 and ICC2 were not checked.","s":"InternetComputerConsensus","t":"Internet Computer Consensus","u":"PODC2022/InternetComputerConsensus/","v":"easy","y":"2022"},{"a":[141,463,501,540,726,912],"c":"63","m":"4-cycle detection and semiring multiplication hold after a short repair of Lemma 12's proof and two slips; fast ring multiplication and its applications, the main point, were not checked.","s":"AlgebraicCongestedClique","t":"Algebraic Methods in the Congested Clique","u":"PODC2015/AlgebraicCongestedClique/","v":"easy","y":"2015"},{"a":[39,122,350,654,1022,1047],"c":"62","m":"RGA as printed violates even the weak list specification, but a one-line index fix proves Theorem 1; the Ω(D) metadata lower bound holds after two local proof repairs.","s":"CollaborativeListSpec","t":"Specification and Complexity of Collaborative Text Editing","u":"PODC2016/CollaborativeListSpec/","v":"easy","y":"2016"},{"a":[516,587,682,702,790],"c":"60","m":"Theorems 2, 4, 10, 12 hold: Ω(n log n) and Ω(n) lower bounds and strong select. Proofs of Theorems 4, 10, 12 need local repairs; randomized O(n log² n) algorithm not checked.","s":"BroadcastUnreliableRadio","t":"Broadcasting in Unreliable Radio Networks","u":"PODC2010/BroadcastUnreliableRadio/","v":"easy","y":"2010"},{"a":[364,956],"c":"55","m":"Theorem 2 (CGC convergence) holds; Theorem 1 is vacuous literally, so '2f-redundancy is necessary' survives only as per-execution indistinguishability with exactly f faults and a common minimum point.","s":"RedundantOptimization","t":"Fault-Tolerance in Distributed Optimization: The Case of Redundancy","u":"PODC2020/RedundantOptimization/","v":"weakened","y":"2020"},{"a":[564,364,956],"c":"55","m":"Sufficiency holds after a local repair; necessity is false or vacuous as stated and holds on redundant inputs by a new proof, placing resilience in [eps', 2 eps']; gradient-descent results unchecked.","s":"ApproxByzantineOptimization","t":"Approximate Byzantine Fault-Tolerance in Distributed Optimization","u":"PODC2021/ApproxByzantineOptimization/","v":"hard","y":"2021"},{"a":[492,702,837],"c":"53","m":"Upper bounds hold after local fixes. Lemma 3.11 is false; the Ω(log log n) lower bound is repaired only for bounded challenges, so the claim with unbounded shared randomness stays unproved.","s":"InteractiveDistributedProofs","t":"Interactive Distributed Proofs","u":"PODC2018/InteractiveDistributedProofs/","v":"weakened","y":"2018"},{"a":[348,912],"c":"53","m":"Only slips: a typo in the gluing step and an imprecise honest proof. The Θ(log n), Θ(n²) and Θ(n) bounds hold; non-3-colourability was not checked.","s":"LocallyCheckableProofs","t":"Locally Checkable Proofs","u":"PODC2011/LocallyCheckableProofs/","v":"slip","y":"2011"},{"a":[39,69,393],"c":"52","m":"Recoverable read/write and CAS and the test&set impossibility hold; the counter, the only example of nesting, is not NRL, because a nested crash loses READ's volatile sum, and no repair is proved.","s":"NestingSafeRecoverable","t":"Nesting-Safe Recoverable Linearizability: Modular Constructions for Non-Volatile Memory","u":"PODC2018/NestingSafeRecoverable/","v":"weakened","y":"2018"},{"a":[947,956],"c":"50","m":"Tight conditions hold, synchronous and asynchronous. Algorithm WA can deadlock as printed, fixed by keeping early messages. Side result Theorem 5 holds only for eventual outputs.","s":"CrashConsensusDigraph","t":"Fault-Tolerant Consensus in Directed Graphs","u":"PODC2015/CrashConsensusDigraph/","v":"easy","y":"2015"},{"a":[526,936,1057],"c":"49","m":"The tight bound 3f + 2t − 1 (5f − 1 for t = f) holds in both directions; the safety proof needs one extra check on votes.","s":"FastByzantineConsensus","t":"Revisiting Optimal Resilience of Fast Byzantine Consensus","u":"PODC2021/FastByzantineConsensus/","v":"easy","y":"2021"},{"a":[11,71,358,602,1039],"c":"49","m":"Protected Memory Paxos breaks agreement as printed, and two local fixes restore safety; the lower bound and Lemma 4.1 hold; the Byzantine algorithm and two-delay liveness were not checked.","s":"RDMAAgreement","t":"The Impact of RDMA on Agreement","u":"PODC2019/RDMAAgreement/","v":"easy","y":"2019"},{"a":[1017,395],"c":"48","m":"Hedging of swaps and the auction lemmas hold after local changes to Lemmas 2–3, Equation (1) and one redemption rule; brokered commerce and general multi-party liveness were not checked.","s":"SoreLoserHedging","t":"Hedging Against Sore Loser Attacks in Cross-Chain Transactions","u":"PODC2021/SoreLoserHedging/","v":"easy","y":"2021"},{"a":[271,767,768,772,959],"c":"48","m":"Liveness Theorem 5.15 is false: with one crash among three processes a received value is never learnt, so O(N) falls; no repair proved. Safety holds; Algorithm 1 fixed by one guard.","s":"GeneralizedLatticeAgreement","t":"Generalized Lattice Agreement","u":"PODC2012/GeneralizedLatticeAgreement/","v":"lost","y":"2012"},{"a":[142,350],"c":"46","m":"SI characterisation, chopping and robustness results hold; Lemma 26's proof misses a case, fixed by reordering it, and a typo in Definition 20 makes Theorem 21 false as printed.","s":"AnalysingSI","t":"Analysing Snapshot Isolation","u":"PODC2016/AnalysingSI/","v":"easy","y":"2016"},{"a":[46,141,239,254,537,726],"c":"45","m":"Near-quadratic bounds for MDS, directed Hamiltonian path and cycle, Steiner tree and max-cut hold; Claim 2.2 needed a new proof, the others local fixes; undirected variants and Sections 3-5 unchecked.","s":"HardnessOptimization","t":"Hardness of Distributed Optimization","u":"PODC2019/HardnessOptimization/","v":"hard","y":"2019"},{"a":[277,340,712,839,871,884],"c":"45","m":"1-resilient patterns exist and perfect resilience is impossible, by new proofs. Lemmas 4.1 and 4.2 are false. The paper's algorithm is ill-defined, so extending arbitrary tables in polynomial time stays unproved.","s":"ResilientRouting","t":"Brief Announcement: On the Resilience of Routing Tables","u":"PODC2012/ResilientRouting/","v":"weakened","y":"2012"},{"a":[2,71,1021],"c":"44","m":"All four (G)BCA protocols hold; Lemmas 4.5 and 4.9 need local proof repairs and Algorithm 5 a one-word fix. Efficiency comparisons and probabilistic round bounds were not checked.","s":"BindingCrusaderAgreement","t":"Efficient and Adaptively Secure Asynchronous Binary Agreement via Binding Crusader Agreement","u":"PODC2022/BindingCrusaderAgreement/","v":"easy","y":"2022"},{"a":[471],"c":"44","m":"Theorem 1 is false: Algorithm 1 can fail with probability above 0.98, leaving the results through it unestablished. The local-clock bound holds for m ≥ 4; Section 4's stable protocol was not checked.","s":"WirelessPacketScheduling","t":"Dynamic Packet Scheduling in Wireless Networks","u":"PODC2012/WirelessPacketScheduling/","v":"weakened","y":"2012"},{"a":[429,655,857],"c":"43","m":"Tight bounds Tₙ(h) = Θ(n³/h²) hold, but the upper bound's expander proof needed a new counting argument; the exact formula for Uₙ(h) lacks a ceiling. The link to Byzantine agreement was not checked.","s":"EquivocationPrice","t":"On the Price of Equivocation in Byzantine Agreement","u":"PODC2012/EquivocationPrice/","v":"hard","y":"2012"},{"a":[56,141,850],"c":"42","m":"No mistakes: the (2+ε)-approximation and its round bounds hold, also for CONGEST apart from message sizes. Of the contradiction with [KMW10] only the arithmetic was checked.","s":"VertexCoverLocalRatio","t":"A Distributed (2+ε)-Approximation for Vertex Cover in O(log Δ/ε log log Δ) Rounds","u":"PODC2016/VertexCoverLocalRatio/","v":"correct","y":"2016"},{"a":[783,900],"c":"41","m":"The characterizations of Σ (QUORUM) and of Ω in read/write (SOURCE, TOUR) and the adversary hierarchy are refuted; SOURCE for Ω in AMP is unestablished. Theorem 1 and Theorem 6 stand.","s":"MessageAdversariesVsFD","t":"Synchrony Weakened by Message Adversaries vs Asynchrony Restricted by Failure Detectors","u":"PODC2013/MessageAdversariesVsFD/","v":"lost","y":"2013"},{"a":[56,141,326,850],"c":"39","m":"Deterministic core holds with slips: line 11 of Algorithm 1 overwrites instead of summing, N(v) must be closed, Δ ≥ 1. Randomized results, the CONGEST line-graph simulation and Section 3 were not checked.","s":"MaxISLocalRatio","t":"Distributed Approximation of Maximum Independent Set and Maximum Matching","u":"PODC2017/MaxISLocalRatio/","v":"slip","y":"2017"},{"a":[125,358,455],"c":"39","m":"The impossibility holds, but the literal framework admits a silent TM, so it needs a step-based model, and the crash-free case needs a new schedule. Theorem 3 was not checked.","s":"TMLiveness","t":"On the Liveness of Transactional Memory","u":"PODC2012/TMLiveness/","v":"hard","y":"2012"},{"a":[50,407,695,912],"c":"38","m":"Ω(log* n) for weak 2-coloring holds after local proof repairs; Lemma 3's algorithm is wrong and was redesigned, so P* stays Θ(log n). The classification was not checked.","s":"MinimalSymmetryBreaking","t":"Hardness of Minimal Symmetry Breaking in Distributed Computing","u":"PODC2019/MinimalSymmetryBreaking/","v":"hard","y":"2019"},{"a":[329,1004],"c":"38","m":"The Ω(log n) space lower bound holds after local proof repairs (the coin-fixing step is dropped). The randomized time upper bounds were not checked.","s":"LeaderElectionSpaceLB","t":"On the Time and Space Complexity of Randomized Test-And-Set","u":"PODC2012/LeaderElectionSpaceLB/","v":"easy","y":"2012"},{"a":[559,956],"c":"36","m":"As printed, an isolated faulty processor can trigger diagnosis forever, breaking the t(t+1) bound; ignoring its Detected bits restores the bound and the complexity. Consensus holds.","s":"ErrorFreeMultivaluedBC","t":"Error-Free Multi-Valued Consensus with Byzantine Failures","u":"PODC2011/ErrorFreeMultivaluedBC/","v":"easy","y":"2011"},{"a":[109,695],"c":"35","m":"Exact bound T_Δ(x, y), so 2Δ − 1 for maximal matching, holds in the port-numbering model after local fixes to §5's output rule and Lemma 4.3. LOCAL lifting was not checked.","s":"TightBipartiteMatching","t":"Truly Tight-in-Δ Bounds for Bipartite Maximal Matching and Variants","u":"PODC2020/TightBipartiteMatching/","v":"easy","y":"2020"},{"a":[306,692,851],"c":"35","m":"Tight contraction-rate and decision-time bounds hold, Theorem 11 by a new proof. Theorem 4's converse is false; the valency characterization of exact consensus needs continuous consensus functions.","s":"AsymptoticConsensus","t":"Tight Bounds for Asymptotic and Approximate Consensus","u":"PODC2018/AsymptoticConsensus/","v":"weakened","y":"2018"},{"a":[262,740,855,992],"c":"34","m":"Theorems 1 and 2 hold; the proof of Lemma 9 has a view-depth off-by-one for the printed A*, repaired by using one more view level at the same round cost.","s":"RandomizationTwoHop","t":"Anonymous Networks: Randomization = 2-Hop Coloring","u":"PODC2014/RandomizationTwoHop/","v":"easy","y":"2014"},{"a":[692,846,1003],"c":"32","m":"Theorem 5.5 and the limit form of Corollary 5.18 hold; the component and broadcastability characterizations (5.6, 5.11, 6.7) and Corollaries 6.1, 6.5 are false; Theorem 6.6 is unestablished.","s":"TopologicalConsensus","t":"Topological Characterization of Consensus under General Message Adversaries","u":"PODC2019/TopologicalConsensus/","v":"weakened","y":"2019"},{"a":[10,343,1004],"c":"32","m":"Linearizability of the transformation holds, but Lemma 4.5's proof is broken and needed a new linearization argument; the wait-freedom and step-complexity claims were not checked.","s":"WritableObjects","t":"Making Objects Writable","u":"PODC2014/WritableObjects/","v":"hard","y":"2014"},{"a":[233,796],"c":"31","m":"Correctness and the size bound of the modified greedy spanner hold; Lemma 7's proof needs kf = o(n) instead of f = o(n). Running times and distributed results were not checked.","s":"FaultTolerantSpanners","t":"Efficient and Simple Algorithms for Fault-Tolerant Spanners","u":"PODC2020/FaultTolerantSpanners/","v":"easy","y":"2020"},{"a":[91,721],"c":"31","m":"Theorem 1 and Corollary 2 hold for vertex and edge faults; Algorithm 1 leaves u, v not in F implicit, and the bound degenerates for f > n/2. Optimality was not checked.","s":"VFTSpannersOptimal","t":"A Trivial Yet Optimal Solution to Vertex Fault Tolerant Spanners","u":"PODC2019/VFTSpannersOptimal/","v":"slip","y":"2019"},{"a":[436,924],"c":"31","m":"Linearizability and wait-freedom of all variants are proved; the efficiency results are unchecked, and Lemma 4.2's Chernoff step, behind the O(log n) bound and Theorem 5.1, is wrong, repaired only on paper.","s":"ConcurrentDSU","t":"A Randomized Concurrent Algorithm for Disjoint Set Union","u":"PODC2016/ConcurrentDSU/","v":"weakened","y":"2016"},{"a":[502,861,963],"c":"30","m":"Transformers (Theorems 1, 2, 4, deterministic 3) and uniform MIS and matching hold after local repairs; randomized Theorem 3 and the arboricity corollaries are not saved; matching needs a new encoding.","s":"UniformLocalAlgorithms","t":"Toward More Localized Local Algorithms: Removing Assumptions Concerning Global Knowledge","u":"PODC2011/UniformLocalAlgorithms/","v":"weakened","y":"2011"},{"a":[221,275,358,470,818,942],"c":"30","m":"The whole characterization of Table 1 is proved; Theorem 19's necessity needed a new cover argument, and auxiliary Lemma 34 is unproved but unused.","s":"HomonymsBA","t":"Byzantine Agreement with Homonyms","u":"PODC2011/HomonymsBA/","v":"hard","y":"2011"},{"a":[989,1058,661,165,554],"c":"30","m":"Printed specs are unsafe, but repaired Raft* provably refines repaired MultiPaxos; the porting guarantee holds only for single-step refinements, so it is not established for Raft*, the paper's actual case.","s":"PaxosRaftRefinement","t":"On the Parallels between Paxos and Raft, and how to Port Optimizations","u":"PODC2019/PaxosRaftRefinement/","v":"weakened","y":"2019"},{"a":[326,367],"c":"29","m":"The O(δD) shortcut theorem is proved after local repairs (8δ+1 blocks, one more halving round); the tightness claim is not saved, as the Lemma 3.2 construction exceeds its diameter bound.","s":"LowCongestionShortcuts","t":"Low-Congestion Shortcuts for Graphs Excluding Dense Minors","u":"PODC2021/LowCongestionShortcuts/","v":"weakened","y":"2021"},{"a":[475,673,956],"c":"29","m":"The tight connectivity and degree characterization holds for n ≥ 2. Algorithm 1 needs simple paths, and short proof repairs are needed. The hybrid model and the efficient algorithm were not checked.","s":"LocalBroadcastBC","t":"Exact Byzantine Consensus on Undirected Graphs under Local Broadcast Model","u":"PODC2019/LocalBroadcastBC/","v":"easy","y":"2019"},{"a":[423,770,783],"c":"28","m":"Theorem 9 fails for the comparison-based algorithms Section 2.3 requires, and Lemma 1 misses a condition; both fixes are local. The task structure and the universality of perfect renaming hold.","s":"SymmetryBreakingTasks","t":"The Universe of Symmetry Breaking Tasks","u":"PODC2011/SymmetryBreakingTasks/","v":"easy","y":"2011"},{"a":[50,109,516,695],"c":"28","m":"The Ω(log Δ) port-numbering lower bound by round elimination holds; Lemma 15 needs Δ ≥ 2 and one definition has a wrong symbol. The lifting to LOCAL was not checked.","s":"MISTreeLowerBounds","t":"Improved Distributed Lower Bounds for MIS and Bounded (Out-)Degree Dominating Sets in Trees","u":"PODC2021/MISTreeLowerBounds/","v":"slip","y":"2021"},{"a":[925],"c":"28","m":"All checked theorems hold, but the proofs of mutex deadlock-freedom and of renaming uniqueness are wrong and needed new arguments. Figure 2 breaks on input 0; a local change fixes it.","s":"MemoryAnonymousCoordination","t":"Coordination Without Prior Agreement","u":"PODC2017/MemoryAnonymousCoordination/","v":"hard","y":"2017"},{"a":[141,239],"c":"27","m":"The main CONGEST lower bounds for directed spanners hold, and Lemma 3.2's reduction needs one extra round. The algorithms and the weighted and LOCAL bounds were not checked.","s":"SpannerApproximation","t":"Distributed Spanner Approximation","u":"PODC2018/SpannerApproximation/","v":"easy","y":"2018"},{"a":[27,845,881],"c":"27","m":"Local constant factor for bounded genus holds after easy repairs of Lemmas 7, 9, 11 and Corollary 8, but Theorem 13's O(g) factor is only proved as O(g²).","s":"BoundedGenusMDS","t":"A Local Constant Factor MDS Approximation for Bounded Genus Graphs","u":"PODC2016/BoundedGenusMDS/","v":"weakened","y":"2016"},{"a":[328,567,992],"c":"26","m":"Π_AA is broken: Π_rBC is inconsistent for tₛ ≥ n/3, so honest parties stay at 0 and 1 (n = 3). The impossibility bound stands; no working protocol is proved.","s":"HybridApproxAgreement","t":"Optimal Synchronous Approximate Agreement with Asynchronous Fallback","u":"PODC2022/HybridApproxAgreement/","v":"lost","y":"2022"},{"a":[423,783,925],"c":"26","m":"All main results hold for n ≥ 2, but Theorem 2, the (n,x)-liveness hierarchy, needed a new model of blocking base objects; Lemma 6 and the arbiter specification have easy fixes.","s":"AsymmetricProgress","t":"On Asymmetric Progress Conditions","u":"PODC2010/AsymmetricProgress/","v":"hard","y":"2010"},{"a":[39,350,376,793],"c":"26","m":"Opacity suffices for refinement after small definition fixes and is necessary for trace refinement, but Theorem 24's necessity for states has a broken proof and is open for the intended semantics.","s":"TMObservationalRefinement","t":"A Programming Language Perspective on Transactional Memory Consistency","u":"PODC2013/TMObservationalRefinement/","v":"weakened","y":"2013"},{"a":[260,322,867,1066],"c":"25","m":"All formalized bounds and algorithms hold after local proof repairs; the only loss is the word 'anonymous' in Theorem 8.8, whose n − 1 location protocol is proved only with process identifiers.","s":"ComplexityHierarchy","t":"A Complexity-Based Hierarchy for Multiprocessor Synchronization","u":"PODC2016/ComplexityHierarchy/","v":"easy","y":"2016"},{"a":[141,737,932],"c":"25","m":"The stack is not an exact order type; the global view theorem misses increment; the read/write max register proof has a gap. Queue and snapshot impossibility and the definition of help stand.","s":"HelpFreeWaitFree","t":"Help!","u":"PODC2015/HelpFreeWaitFree/","v":"weakened","y":"2015"},{"a":[262,469],"c":"24","m":"Thin unison (Theorem 1.1) stands after local repairs. The synchronizer corollary is false for arbitrary tasks and holds for static ones such as LE and MIS. The LE and MIS theorems were not checked.","s":"ThinUnison","t":"A Thin Self-Stabilizing Asynchronous Unison Algorithm","u":"PODC2021/ThinUnison/","v":"weakened","y":"2021"},{"a":[682],"c":"24","m":"Figure 1's networks fail for D = 4, so Theorem 3.3 needed a new gadget. All lower bounds and the single-hop algorithm hold after small repairs. wPAXOS was not checked.","s":"AbstractMACConsensus","t":"Consensus with an Abstract MAC Layer","u":"PODC2014/AbstractMACConsensus/","v":"hard","y":"2014"},{"a":[367,426,1071],"c":"24","m":"Lemma 3's verification and Lemma 2's broadcast needed local repairs; the deterministic core stands. The randomized construction and end-to-end round bounds were not checked.","s":"ShortcutsNoEmbedding","t":"Low-Congestion Shortcuts without Embedding","u":"PODC2016/ShortcutsNoEmbedding/","v":"easy","y":"2016"},{"a":[400,540,912],"c":"24","m":"The (7 − ε) lower bound holds as stated; Lemma 1 only needs the implied assumption m ≥ 2T + 3.","s":"PlanarMDSLowerBound","t":"Brief Announcement: Local Approximability of Minimum Dominating Set on Planar Graphs","u":"PODC2014/PlanarMDSLowerBound/","v":"slip","y":"2014"},{"a":[841,206],"c":"24","m":"Equivocation breaks no duplication, so the main embedding theorem fails; it holds for properties that survive Byzantine duplicates. Block DAG, gossip and interpretation lemmas stand; transfer of arbitrary liveness properties unchecked.","s":"BFTInBlockDAG","t":"Embedding a Deterministic BFT Protocol in a Block DAG","u":"PODC2021/BFTInBlockDAG/","v":"weakened","y":"2021"},{"a":[435,441],"c":"24","m":"Lemma 9's invariant is false, even in crash-free runs; a new invariant and liveness argument prove Lemmas 4-8 for the k-ported algorithm. The RMR bounds and the arbitration tree are unchecked.","s":"RMESubLogBoth","t":"A Recoverable Mutex Algorithm with Sub-logarithmic RMR on Both CC and DSM","u":"PODC2019/RMESubLogBoth/","v":"hard","y":"2019"},{"a":[290,567,573],"c":"23","m":"The t < n/3 protocol works with threshold t + 1, not n - 2t. The 3κ/2-round t < n/2 protocol fails against the claimed adaptive adversary: one iteration errs with probability at least 1/2.","s":"RoundEfficientBA","t":"A New Way to Achieve Round-Efficient Byzantine Agreement","u":"PODC2021/RoundEfficientBA/","v":"weakened","y":"2021"},{"a":[374,964],"c":"23","m":"Theorem 1 and Theorem 2 hold, the latter after a new counting argument replaces its wrong agreement proof; the rest are slips in Algorithm 1. The equilibrium results, Theorems 3 and 4, are unchecked.","s":"RationalConsensus","t":"Rational Consensus","u":"PODC2016/RationalConsensus/","v":"hard","y":"2016"},{"a":[61,296,724],"c":"23","m":"Compiler and universal bound hold. The crossing lower bounds fail for an illegal G but hold for a legal G, which every application has. MST bounds and upper bounds of Theorems 5.2-5.3 are unchecked.","s":"RandomizedPLS","t":"Randomized Proof-Labeling Schemes","u":"PODC2015/RandomizedPLS/","v":"easy","y":"2015"},{"a":[859,235,592,93,913],"c":"23","m":"Algorithm 1 is not weakly consistent, so Eventual Consensus is not shown sufficient; nonblocking and Lemma 5 are false. Locality and Theorem 2 hold; Theorem 4 and Aurora are unchecked.","s":"EventualLinearizability","t":"Eventually Linearizable Shared Objects","u":"PODC2010/EventualLinearizability/","v":"lost","y":"2010"},{"a":[178,332,358,493,962],"c":"22","m":"Classification and the Ω(t²) bound hold; Lemma 3's proof needs a local repair for n < 2t. Universal's O(n²) messages, and sufficiency with clock drift and sleeping processes, are unchecked.","s":"ValidityConsensus","t":"On the Validity of Consensus","u":"PODC2023/ValidityConsensus/","v":"easy","y":"2023"},{"a":[10,423,783,925,1004],"c":"22","m":"Algorithm 1 livelocks at n = 4, m = 5, so the read/write characterization has only its necessity half. The read/modify/write characterization holds, with a new proof of Theorem 4.","s":"AnonymousMutex","t":"Optimal Memory-Anonymous Symmetric Deadlock-Free Mutual Exclusion","u":"PODC2019/AnonymousMutex/","v":"weakened","y":"2019"},{"a":[407,912],"c":"22","m":"The k - 1 lower bound and Ω(Δ) hold; the proof omits the passage from infinite colour systems to finite graphs, closed by a short 2^k-copies construction.","s":"MaximalMatching","t":"Distributed Maximal Matching: Greedy is Optimal","u":"PODC2012/MaximalMatching/","v":"easy","y":"2012"},{"a":[326,454,587,682],"c":"21","m":"BMMB's upper bounds hold after local repairs. The grey zone lower bound's schedule breaks for two or more messages per broadcast; its one-message case and Section 4 are unchecked.","s":"MultiMessageBroadcastMAC","t":"Multi-Message Broadcast with Abstract MAC Layers and Unreliable Links","u":"PODC2014/MultiMessageBroadcastMAC/","v":"weakened","y":"2014"},{"a":[237,540],"c":"21","m":"All checked bounds hold (t²f/44 Byzantine, f + 2 rounds, Ω(n²f) crash); the orderly-crash algorithm needed a new correctness proof, and three other proofs needed local repairs.","s":"EarlyDecidingExpensive","t":"Early-Deciding Consensus is Expensive","u":"PODC2013/EarlyDecidingExpensive/","v":"hard","y":"2013"},{"a":[123,167,240,692,863,1014],"c":"20","m":"Protocol 3 as printed never stabilizes, but with the intended guard it is proved correct; a by-product tail bound fails. State lower bounds hold; the time bounds and Section 5 were not checked.","s":"TimeOptimalSSLE","t":"Time-Optimal Self-Stabilizing Leader Election in Population Protocols","u":"PODC2021/TimeOptimalSSLE/","v":"easy","y":"2021"},{"a":[658,783],"c":"20","m":"The two-bit atomic register is correct, safety and liveness; the proofs of Lemmas 5 and 10 need small repairs, and code between waits must run atomically, as is standard.","s":"TwoBitRegisters","t":"Two-Bit Messages are Sufficient to Implement Atomic Read/Write Registers in Crash-prone Systems","u":"PODC2016/TwoBitRegisters/","v":"easy","y":"2016"},{"a":[731,711,806,780,760],"c":"20","m":"Lemma 1 is false, so the proofs of Theorems 1 and 2 fail; both theorems are re-proved by a new argument. The WRTO algorithm and the lower bounds were not checked.","s":"DAPInvisibleReads","t":"Disjoint-Access Parallelism: Impossibility, Possibility, and Cost of Transactional Memory Implementations","u":"PODC2015/DAPInvisibleReads/","v":"hard","y":"2015"},{"a":[586,655],"c":"20","m":"Impossibility, TDRM and CDRM all hold after slips (PO needs a strict inequality); TDRM's Sybil-proofness needed a new proof, since the appendix argument fails.","s":"IncentiveTrees","t":"Fair and Resilient Incentive Tree Mechanisms","u":"PODC2013/IncentiveTrees/","v":"hard","y":"2013"},{"a":[82,797,846],"c":"19","m":"Theorem 1 needs repaired conditions and Theorem 2 holds, but its bound is not the claimed tight border; Theorem 8's exact border for initial crashes stands. Section VII unchecked.","s":"KSetAgreement","t":"Easy Impossibility Proofs for k-Set Agreement in Message Passing Systems","u":"PODC2011/KSetAgreement/","v":"weakened","y":"2011"},{"a":[58,259,591],"c":"19","m":"Colour counts hold, including Δ + o(Δ) for a = o(Δ), after an easy repair of Theorem 3.2; Theorem 5.4's final step fails as cited, leaving the polylog claim unsupported. Running times unchecked.","s":"DeltaEdgeColoring","t":"Deterministic Distributed (Δ + o(Δ))-Edge-Coloring, and Vertex-Coloring of Graphs with Bounded Diversity","u":"PODC2017/DeltaEdgeColoring/","v":"weakened","y":"2017"},{"a":[260,274,504,631,943],"c":"19","m":"Theorem 5's impossibility holds; its statement only leaves implied assumptions unstated, and Assumption 3 needs a per-instance reading. The DAP-UC construction and Theorem 6 are unchecked.","s":"DAPUniversalConstruction","t":"Universal Constructions that Ensure Disjoint-Access Parallelism and Wait-Freedom","u":"PODC2012/DAPUniversalConstruction/","v":"slip","y":"2012"},{"a":[168],"c":"18","m":"SS-Tree, the O(k^12) protocol, is refuted: all-root configurations keep every node a leader forever. SS-EulerCycle fails as printed but a one-line repair works, proved for even degree assuming the ring protocol.","s":"SSLERegular","t":"Self-Stabilizing Leader Election in Regular Graphs","u":"PODC2020/SSLERegular/","v":"weakened","y":"2020"},{"a":[281,1030],"c":"18","m":"Corollary 5.2 is false: TV strong spatial mixing does not imply multiplicative mixing, a minor by-product. The cores of the main reductions and of Theorem 5.1 hold; their composition and round counts are unchecked.","s":"LocalSamplingCounting","t":"On Local Distributed Sampling and Counting","u":"PODC2018/LocalSamplingCounting/","v":"easy","y":"2018"},{"a":[77,483,505,595,954],"c":"18","m":"Observation 3.2's constant is about twice too large; the lower bounds of Theorems 4.1-4.3 hold after local proof repairs. The upper bounds (Theorems 2.3, 3.3, Table 1) were not checked.","s":"DeterministicLoadBalancing","t":"Improved Analysis of Deterministic Load-Balancing Schemes","u":"PODC2015/DeterministicLoadBalancing/","v":"easy","y":"2015"},{"a":[106,658,783],"c":"17","m":"Figure 3 can block forever, so EA-Termination and consensus termination are false, and the proof of Lemma 3 fails; whether a repair works is open. Safety, CB-broadcast and adopt-commit hold.","s":"MinimalSynchronyBC","t":"Minimal Synchrony for Byzantine Consensus","u":"PODC2015/MinimalSynchronyBC/","v":"lost","y":"2015"},{"a":[127,990,587],"c":"17","m":"With FIFO channels a constant-state relay refutes the bounds of Theorems 4.1, 5.1, B.1. The no-gossip bounds hold with a new assumption, ReaderQuiet. Theorem 6.5 and non-FIFO channels unchecked.","s":"StorageCostLowerBounds","t":"Information-Theoretic Lower Bounds on the Storage Cost of Shared Memory Emulation","u":"PODC2016/StorageCostLowerBounds/","v":"lost","y":"2016"},{"a":[141,367,396,1071],"c":"17","m":"All checked results hold, but the routing lower bound of Lemma 15 needed a new proof. The broadcast algorithms, the worst-case gap and Lemma 26 (noticed gap, undecided) were not checked.","s":"NoisyRadioBroadcast","t":"Broadcasting in Noisy Radio Networks","u":"PODC2017/NoisyRadioBroadcast/","v":"hard","y":"2017"},{"a":[508,658],"c":"17","m":"Two Byzantine processes break agreement at n = 7, t = 2, so the protocol is not Byzantine agreement; Theorem 2 and Lemma 5 are false. Validity, Lemmas 1-4 and the basic bit count hold.","s":"CubicBitsBA","t":"Synchronous Byzantine Agreement with Nearly a Cubic Number of Communication Bits","u":"PODC2013/CubicBitsBA/","v":"lost","y":"2013"},{"a":[69,393,819],"c":"16","m":"Algorithm 2 is not linearizable on Cas(v, v) and Algorithm 1's initialization is inconsistent; local fixes save both, and the Omega(N) and auxiliary-state lower bounds are proved.","s":"DetectableSpace","t":"Upper and Lower Bounds on the Space Complexity of Detectable Objects","u":"PODC2020/DetectableSpace/","v":"easy","y":"2020"},{"a":[1,94,105,267],"c":"16","m":"Main 6-colouring algorithm unchecked. Of the lower bounds, Theorem 2.6 is false for odd k by one round; the Omega(sqrt n), Omega(n) bounds and Theorem 2.5's exact bound are proved.","s":"SparseColoringLB","t":"Distributed Coloring in Sparse Graphs with Fewer Colors","u":"PODC2018/SparseColoringLB/","v":"easy","y":"2018"},{"a":[540,573],"c":"16","m":"Main clock-synchronization results unchecked. In the approximate-agreement part all statements hold; only Lemma 8's induction step needs a short repair.","s":"ClockSyncSignatures","t":"Optimal Clock Synchronization with Signatures","u":"PODC2022/ClockSyncSignatures/","v":"easy","y":"2022"},{"a":[886,843,849],"c":"15","m":"Algorithm 2 is not linearizable, and Lemma 3 and Theorems 3 and 4 are false; a one-line VOTE fix restores them all and linearizability, assuming a causal history. Termination unchecked.","s":"CRDTReplication","t":"Linearizable State Machine Replication of State-Based CRDTs without Logs","u":"PODC2019/CRDTReplication/","v":"easy","y":"2019"},{"a":[895,136,174,467],"c":"15","m":"Theorem 1 is false, so the f + 1 lower bound holds only for algorithms not coding across writes. Algorithm 2 needs a local fix; the adaptive algorithm is unchecked.","s":"ReliableStorageSpace","t":"Space Bounds for Reliable Storage: Fundamental Limits of Coding","u":"PODC2016/ReliableStorageSpace/","v":"weakened","y":"2016"},{"a":[630,896],"c":"15","m":"Global-Ring (Theorem 10) is false for n = 6; 2RC still gives the ring, the other checked protocols hold, kRC needs a new proof; running times and universality unchecked.","s":"NetworkConstructors","t":"Simple and Efficient Local Codes for Distributed Stable Network Construction","u":"PODC2014/NetworkConstructors/","v":"hard","y":"2014"},{"a":[96,754,752,933],"c":"15","m":"Both regular-register protocols (CAM, CUM) fail at the paper's own parameters and no repair is proved; only lower bounds 3 and 5 are re-proved, in a restricted model, so optimality is lost.","s":"MobileByzantineStorage","t":"Optimal Mobile Byzantine Fault Tolerant Distributed Storage","u":"PODC2016/MobileByzantineStorage/","v":"lost","y":"2016"},{"a":[912],"c":"14","m":"All algorithms and matching lower bounds hold as stated; the only flaw is a division by zero on edgeless graphs in the ratio computation of Section 7.8.","s":"EdgeDominatingSets","t":"Distributed Algorithms for Edge Dominating Sets","u":"PODC2010/EdgeDominatingSets/","v":"slip","y":"2010"},{"a":[704,808],"c":"14","m":"Deterministic ASM and its O(log^5 n) round count hold; the proof of Lemma 4.4 misses men who turn bad while inactive and needs a new charging argument; randomized variants unchecked.","s":"AlmostStableMatchings","t":"Fast Distributed Almost Stable Matchings","u":"PODC2015/AlmostStableMatchings/","v":"hard","y":"2015"},{"a":[391,433,525,532,538,584,912,967],"c":"14","m":"Both linear orders hold; the simulations of Theorems 4, 8 and 9 overlook stopped neighbours and are fixed locally with the claimed times; the modal-logic characterisation is unchecked.","s":"WeakModelsModalLogic","t":"Weak Models of Distributed Computing, with Connections to Modal Logic","u":"PODC2012/WeakModelsModalLogic/","v":"easy","y":"2012"},{"a":[150,1004],"c":"14","m":"Algorithm correct; O(1) amortized RMRs proved in DSM once a crash also starts a passage, a one-clause change to the definition. The CC bound was not checked.","s":"RecoverableMutexRMR","t":"Recoverable Mutual Exclusion with Constant Amortized RMR Complexity from Standard Primitives","u":"PODC2020/RecoverableMutexRMR/","v":"easy","y":"2020"},{"a":[348,407,912],"c":"14","m":"Omega(Delta) lower bound proved for deterministic algorithms; one step of the unfold-and-mix proof needs a short nested induction. The randomized extension was not checked.","s":"LinearInDeltaLB","t":"Linear-in-Δ Lower Bounds in the LOCAL Model","u":"PODC2014/LinearInDeltaLB/","v":"easy","y":"2014"},{"a":[540,869],"c":"13","m":"Proof of Theorem 1.2, the bit-optimal recursive protocol, fails on terminated nodes; not refuted, no repair proved. Lemma 4.2 false, repaired. Theorems 1.1 and 2.9 hold.","s":"RecursivePhaseKing","t":"A Recursive Early-Stopping Phase King Protocol","u":"PODC2022/RecursivePhaseKing/","v":"lost","y":"2022"},{"a":[109,613,951],"c":"13","m":"Theorems 1.1 and 1.3 hold; the reduction to rank 3 and the rank-1 case needed local repairs. Round bounds and cited lower bounds were not checked.","s":"SharpThresholdLLL","t":"A Sharp Threshold Phenomenon for the Distributed Complexity of the Lovász Local Lemma","u":"PODC2019/SharpThresholdLLL/","v":"easy","y":"2019"},{"a":[540,821,912],"c":"13","m":"Theorem 1 and main Theorem 3 hold, with constants of Section 4.3 corrected. Theorem 2 only with a weaker time constant, nothing depends on it. Section 5 was not checked.","s":"SynchronousCounting","t":"Towards Optimal Synchronous Counting","u":"PODC2015/SynchronousCounting/","v":"easy","y":"2015"},{"a":[89,266,427,627],"c":"13","m":"WS³ soundness and the threshold protocol hold; Proposition 18's proof relies on a false monotonicity claim and misses cases, repaired by a lexicographic ranking. Complexity results and expressiveness were not checked.","s":"PPVerification","t":"Towards Efficient Verification of Population Protocols","u":"PODC2017/PPVerification/","v":"easy","y":"2017"},{"a":[980,1013,648,787,873],"c":"13","m":"The honest-majority protocol behind the amortized linear claim violates Validity and Lemma 3; no repair is proved. Its Consistency holds, and the dishonest-majority protocol holds after a local fix to TrustCast's invocation.","s":"AmortizedByzantineBroadcast","t":"On the Amortized Communication Complexity of Byzantine Broadcast","u":"PODC2023/AmortizedByzantineBroadcast/","v":"lost","y":"2023"},{"a":[6,654,999],"c":"13","m":"All three results hold, but Lemma 15, the core of the iterator-stack impossibility, has a broken construction and needed a redesign. The composed claim of swap from 2-consensus objects was not checked.","s":"UnboundedConcurrency","t":"From Bounded to Unbounded Concurrency Objects and Back","u":"PODC2011/UnboundedConcurrency/","v":"hard","y":"2011"},{"a":[178,332,358,493,716,962],"c":"12","m":"The Ω(t²) lower bound holds for all t after rounding Lemma 1's parameters. Lemma 10 and unauthenticated Theorem 4 fail at n = 2, t = 1; one added condition corrects them.","s":"AllBAExpensive","t":"All Byzantine Agreement Problems Are Expensive","u":"PODC2024/AllBAExpensive/","v":"easy","y":"2024"},{"a":[826,947,956],"c":"12","m":"3-reach is tight and Algorithm BW works after local fixes to message sets, covers, FIFO-Receive and several proof steps. End-to-end sufficiency is proved only for FIFO links; non-FIFO links were not checked.","s":"AsyncApproxBCDirected","t":"Asynchronous Byzantine Approximate Consensus in Directed Networks","u":"PODC2020/AsyncApproxBCDirected/","v":"easy","y":"2020"},{"a":[245,358],"c":"12","m":"SSME's self-stabilization and ⌈diam/2⌉ synchronous bound hold, Theorem 2 by a new proof; the optimality lower bound is false in general and holds only when privileged reads the own state.","s":"SpeculativeStabilization","t":"Introducing speculation in self-stabilization: an application to mutual exclusion","u":"PODC2013/SpeculativeStabilization/","v":"weakened","y":"2013"},{"a":[705,1004],"c":"12","m":"The first-DRead specification needs one added condition; the ABA-detecting register and the snapshot on atomic base objects are then proved. The bounded-space composition and simple types were not checked.","s":"StrongLinSnapshots","t":"Strongly Linearizable Implementations of Snapshots and Other Types","u":"PODC2019/StrongLinSnapshots/","v":"easy","y":"2019"},{"a":[505,954,963],"c":"12","m":"The hub-labeling lower bound holds, but its key step, distance preservation from H to G, is false and needed a new potential argument. The Sum-Index and Ruzsa-Szemerédi sections were not checked.","s":"HubLabelingHardness","t":"Hardness of Exact Distance Queries in Sparse Graphs Through Hub Labeling","u":"PODC2019/HubLabelingHardness/","v":"hard","y":"2019"},{"a":[483,505,710,835],"c":"12","m":"Proofs of Theorems 3.2 and 3.5, the worst-case and best-case cover times of the abstract, are broken and unrepaired, though not refuted. Delayed deployments, corrected Lemma 3.1 and Theorem 3.7 are proved.","s":"RotorRouterRing","t":"The Multi-Agent Rotor-Router on the Ring: A Deterministic Alternative to Parallel Random Walks","u":"PODC2013/RotorRouterRing/","v":"lost","y":"2013"},{"a":[1037,572,986],"c":"11","m":"Termination is false: view change deadlocks after GST. It is proved only with a repaired echo rule on reliable channels, not in the paper's lossy model. Agreement and validity hold; latency and multi-shot unchecked.","s":"TetraBFT","t":"TetraBFT: Reducing Latency of Unauthenticated, Responsive BFT Consensus","u":"PODC2024/TetraBFT/","v":"weakened","y":"2024"},{"a":[856,395,737],"c":"11","m":"No mistakes. The original definition is neither local nor nonblocking; the amended one is both and equals linearization points; the inclusions of Figure 6 are strict.","s":"LinearizabilityTypo","t":"Linearizability: A Typo","u":"PODC2021/LinearizabilityTypo/","v":"correct","y":"2021"},{"a":[1028,600],"c":"11","m":"Attacks on A-LEADuni hold. Theorem 7.2 is proved only for n = 2, and Theorem 8.1's coin-toss step is wrong and unrepaired. Theorem 5.1 and PhaseAsyncLead are unchecked.","s":"FairLeaderElection","t":"Fair Leader Election for Rational Agents in Asynchronous Rings and Networks","u":"PODC2018/FairLeaderElection/","v":"weakened","y":"2018"},{"a":[630,885,896],"c":"11","m":"GraphToStar fails on a 4-node line, no repair proved; its time analysis and the distributed Ω(n log n) bound are unestablished. Centralized lower bounds and subroutines hold; Sections 4–5 are unchecked.","s":"ActivelyDynamicNetworks","t":"Distributed Computation and Reconfiguration in Actively Dynamic Networks","u":"PODC2020/ActivelyDynamicNetworks/","v":"weakened","y":"2020"},{"a":[435],"c":"11","m":"Theorem 7.3 holds. Lemma 7.2's printed Q lacks x_μ = X, which the prose states; I₁ of Lemma 7.1 is not inductive and needs a local strengthening.","s":"MemSnap","t":"MemSnap: A Fast Adaptive Snapshot Algorithm for RMWable Shared-Memory","u":"PODC2024/MemSnap/","v":"easy","y":"2024"},{"a":[955,1068],"c":"10","m":"Theorems 2 and 3 hold. Lemmas 14 and 17 have wrong proof steps, so the O(D² log n) bound needed a new martingale proof; Lemma 19 is false for small D, fixed by 2D+3 windows.","s":"MinimalistLE","t":"Minimalist Leader Election Under Weak Communication","u":"PODC2025/MinimalistLE/","v":"hard","y":"2025"},{"a":[936,301],"c":"10","m":"The weight restriction and qualification bounds hold. The weight separation bound and Swiper's construction for it are false; a different linear bound, with a new rounding offset, is proved. Protocol transformations unchecked.","s":"Swiper","t":"Swiper: a new paradigm for efficient weighted distributed protocols","u":"PODC2024/Swiper/","v":"hard","y":"2024"},{"a":[588,218],"c":"10","m":"The round and resilience bounds hold. Theorem 6.1 is false for n ≤ 3, Lemmas 4.7 and 4.8 fail for ⊥, and the authenticated model drops crash runs; all are fixed by local conditions.","s":"NonEquivocation","t":"On the Subject of Non-Equivocation: Defining Non-Equivocation in Synchronous Agreement Systems","u":"PODC2020/NonEquivocation/","v":"easy","y":"2020"},{"a":[10,1004],"c":"10","m":"The lower bounds hold for linearizable implementations, the register bound checked for deterministic ones only. The weak correctness condition is misworded and Lemma 2 misses a case; both are local fixes. Upper bounds unchecked.","s":"ABADetection","t":"On the Time and Space Complexity of ABA Prevention and Detection","u":"PODC2015/ABADetection/","v":"easy","y":"2015"},{"a":[332,682,956,993],"c":"10","m":"The entropy and perfect-advice lower bounds hold, but the proofs of Theorems 3.3 and 3.7 are wrong and were replaced by new arguments. Collision-detection entropy bound and randomized upper bounds unchecked.","s":"ContentionPredictions","t":"Contention Resolution with Predictions","u":"PODC2021/ContentionPredictions/","v":"hard","y":"2021"},{"a":[20,262,279,926],"c":"10","m":"The checked bounds and \"ignorance is bliss\" hold. Rosenthal's potential fails with infinite costs but works on connecting profiles; several proofs need local repairs. Lemma 3.4 and the online bound behind Lemma 3.5 unchecked.","s":"BayesianIgnorance","t":"Bayesian Ignorance","u":"PODC2010/BayesianIgnorance/","v":"easy","y":"2010"},{"a":[36],"c":"10","m":"Two slips only; the composition, adopt-commit and conciliator results hold, but the end-to-end consensus bound was checked only conditionally on a per-stage failure hypothesis.","s":"ModularConsensus","t":"A Modular Approach to Shared-Memory Consensus, with Applications to the Probabilistic-Write Model","u":"PODC2010/ModularConsensus/","v":"slip","y":"2010"},{"a":[257,394,845],"c":"9","m":"The first linear upper bound holds as stated; the printed proof is one round short, and a recount of the same pigeonhole closes it.","s":"DynamicRootedTrees","t":"Broadcasting Time in Dynamic Rooted Trees is Linear","u":"PODC2022/DynamicRootedTrees/","v":"easy","y":"2022"},{"a":[91,719],"c":"9","m":"Restorable tiebreaking exists as claimed; Corollary 22's count and Theorem 23's proof need local repairs, and application sizes for f ≥ 1 and all running-time and CONGEST claims were not checked.","s":"RestorableTiebreaking","t":"Restorable Shortest Path Tiebreaking for Edge-Faulty Graphs","u":"PODC2021/RestorableTiebreaking/","v":"easy","y":"2021"},{"a":[349,657],"c":"9","m":"Silent Choir, the lower bounds and STEALTH, D2, 1.5D hold, but the protocol proofs' black-box consensus fails and needed a concrete floodset and a new argument; the tradeoff needed a D = 1 bound.","s":"Silence","t":"Silence","u":"PODC2018/Silence/","v":"hard","y":"2018"},{"a":[597,771],"c":"9","m":"Both (2 − ε) lower bounds hold after a hub or sink and a parity step; the algorithms, the paper's other main part, and the larger-factor lower bounds were not checked.","s":"MinWeightCycleCongest","t":"Computing Minimum Weight Cycle in the CONGEST Model","u":"PODC2024/MinWeightCycleCongest/","v":"easy","y":"2024"},{"a":[200,572,1046],"c":"9","m":"Algorithm 1 as printed is unsafe even in synchronous runs; a one-word fix from [MMR] saves it, and Theorem 2 and Theorem 1's safety are proved. Liveness and healing unchecked.","s":"SleepyTOB","t":"Asynchrony-Resilient Sleepy Total-Order Broadcast Protocols","u":"PODC2024/SleepyTOB/","v":"easy","y":"2024"},{"a":[56,141,613,709,732],"c":"9","m":"All checked statements hold; Corollary 17's proof misapplies Theorem 12 but its 5/3 bound is saved by a new accounting. Round complexities and the MDS half unchecked.","s":"PowerGraphApproximation","t":"Distributed Approximation on Power Graphs","u":"PODC2020/PowerGraphApproximation/","v":"easy","y":"2020"},{"a":[50,109,254,407,613,695,912],"c":"9","m":"All checked statements hold; proofs of Theorems 8.1 and 8.2 need short local repairs. The Θ(n) families and round-elimination fixed points are proved; the complete classification itself is unchecked.","s":"BinaryLabelingClassification","t":"Brief Announcement: Classification of Distributed Binary Labeling Problems","u":"PODC2020/BinaryLabelingClassification/","v":"easy","y":"2020"},{"a":[125,358],"c":"9","m":"Theorem 4.9 is false with idle steps but proved under the paper's reactive convention after a local proof repair; two false remarks corrected. Section 5's TM inputs unchecked.","s":"SafetyLivenessExclusion","t":"Safety-Liveness Exclusion in Distributed Computing","u":"PODC2015/SafetyLivenessExclusion/","v":"easy","y":"2015"},{"a":[235,358,592,913,974],"c":"9","m":"Both lower bounds hold in the round model of [1]; the scaling step works only when t_k divides t, and new block sizes repair it. Section 5's upper bounds unchecked.","s":"RobustAtomicStorage","t":"The Complexity of Robust Atomic Storage","u":"PODC2011/RobustAtomicStorage/","v":"easy","y":"2011"},{"a":[137,801],"c":"8","m":"Lemma 7.4 and Claim 7.2 are false as stated, but local changes save their uses; impossibility, predictive verification and self-enforcement all hold, with progress claims unchecked.","s":"RuntimeVerification","t":"Asynchronous Wait-Free Runtime Verification and Enforcement of Linearizability","u":"PODC2023/RuntimeVerification/","v":"easy","y":"2023"},{"a":[770,779],"c":"8","m":"Topological proof of Arrow's theorem stands after local repairs; Theorem 4.2 is false, and the domain characterization holds only after a redesign and for subdomains keeping every pair free.","s":"ArrowTopology","t":"A Distributed Combinatorial Topology Approach to Arrow's Impossibility Theorem","u":"PODC2022/ArrowTopology/","v":"weakened","y":"2022"},{"a":[366,413,939],"c":"8","m":"All formalized theorems hold; the proof of Theorem 14 is wrong and needed a new construction, and the proof of Theorem 7 needs a conditional form of Lemma 19.","s":"RegisterLinTermination","t":"On Register Linearizability and Termination","u":"PODC2021/RegisterLinTermination/","v":"hard","y":"2021"},{"a":[221,275,526,818],"c":"8","m":"Figures 3 and 4 livelock. Figure 3 has a proved one-line repair; the repeated upper bound (Theorem 8) stays unproved. The lower bound n + m - k holds; anonymous results unchecked.","s":"SetAgreementSpace","t":"On the Space Complexity of Set Agreement","u":"PODC2015/SetAgreementSpace/","v":"weakened","y":"2015"},{"a":[137,347,657],"c":"8","m":"Lemma 1, the core of the combinatorial proof, is false, but one added hypothesis saves it; unbeatability and u-Pmin[k] hold, while the topological proof was not formalized.","s":"UnbeatableSetConsensus","t":"Unbeatable Set Consensus via Topological and Combinatorial Reasoning","u":"PODC2016/UnbeatableSetConsensus/","v":"easy","y":"2016"},{"a":[634,727],"c":"8","m":"Both lower bounds and all algorithms hold; Proposition 2.3's cost bound needs the constant 8w+6, and 10 sectors instead of 6 avoid the false Fact 3.11 in Theorem 3.2's proof.","s":"RendezvousTimeCost","t":"Time Versus Cost Tradeoffs for Deterministic Rendezvous in Networks","u":"PODC2014/RendezvousTimeCost/","v":"easy","y":"2014"},{"a":[305,328,718,821],"c":"7","m":"Tree and block-graph reductions hold, but Theorem 7's signature-based resilience uses a refuted protocol and Lemma 15's block-graph round bound has a broken proof; both claims stay unestablished, not refuted.","s":"TreeAA","t":"Round and Resilience-Optimal Approximate Agreement on Trees and Block Graphs","u":"PODC2026/TreeAA/","v":"weakened","y":"2026"},{"a":[524,797,920,1067],"c":"7","m":"The abstract's tradeoff, the Omega(n log n) bound and both deterministic algorithms hold; Theorem 3.8 is one round too strong, so its k-round message bound holds only as Omega(n^{1+1/k}). Other sections unchecked.","s":"LeaderTradeoffs","t":"Improved Tradeoffs for Leader Election","u":"PODC2023/LeaderTradeoffs/","v":"weakened","y":"2023"},{"a":[22,226,249,439,736],"c":"7","m":"Hierarchy, all impossibilities and Algorithm LE hold; false Lemma 7 needs one extra condition, and proofs of Lemmas 12, 16 and Theorem 1 need local repairs. The cited self-stabilizing algorithms are unchecked.","s":"StabilizingLEDynamic","t":"On Implementing Stabilizing Leader Election with Weak Assumptions on Network Dynamics","u":"PODC2021/StabilizingLEDynamic/","v":"easy","y":"2021"},{"a":[392,399,706,1004],"c":"7","m":"All three bounds hold, but the proof of the one-shot lower bound (Theorem 1.2) breaks and needed new invariants; lower bounds are checked for deterministic implementations only.","s":"TimestampSpace","t":"The Space Complexity of Long-Lived and One-Shot Timestamp Implementations","u":"PODC2011/TimestampSpace/","v":"hard","y":"2011"},{"a":[248,123,66],"c":"7","m":"USI codes from Sidon sets hold with length 8h²(k+1)²; only a mod-l typo in Lemma 4 and degenerate cases are wrong. The beeping algorithms of Sections 4–6 were not checked.","s":"UncoordinatedBeeps","t":"Can Uncoordinated Beeps tell Stories?","u":"PODC2020/UncoordinatedBeeps/","v":"slip","y":"2020"},{"a":[197,266],"c":"7","m":"Leaderless bound η ≤ 2^((2n+2)!) and leader bound η < F(n) hold after local repairs; BB_L must fix the number of leaders. The F_ω level of the leader bound rests on an unchecked citation.","s":"PPStateComplexity","t":"Lower Bounds on the State Complexity of Population Protocols","u":"PODC2021/PPStateComplexity/","v":"easy","y":"2021"},{"a":[204,596,657],"c":"7","m":"The Visible Zigzag Theorem's only-if direction is false for general nodes; it holds with one endpoint a basic node of the past, which covers both coordination tasks. Theorems 1 and 2 stand.","s":"ZigzagCausality","t":"On Using Time Without Clocks via Zigzag Causality","u":"PODC2017/ZigzagCausality/","v":"weakened","y":"2017"},{"a":[707,717,845],"c":"7","m":"The Ω(kℓ) lower bound holds with a slightly better constant, but its adversary needs two local repairs; O(kℓ) for PPL is proved. Theorem 3.2 (O(ℓ) for k = 3) was not checked.","s":"DynamicParti /BayouRevisited/","v":"easy","y":"2019"},{"a":[559,956],"c":"7","m":"Theorem 1 (Equality Check) holds; Appendix C.3's argument is wrong but easily replaced, and Lemma 1 needs large fields. Theorem 2 and Phases 1 and 3 were not checked, so the capacity fraction is conditional.","s":"ByzantineLinearCoding","t":"Byzantine Broadcast in Point-to-Point Networks Using Local Linear Coding","u":"PODC2012/ByzantineLinearCoding/","v":"easy","y":"2012"},{"a":[395,657,950],"c":"7","m":"Transformation and optimality hold for t ≤ n−2 given cited lemmas; at t = n−1 Lemma 5 is false and Theorem 6 clashes with Theorem 3; Corollary 9 needs n ≥ t+k+1.","s":"SimultaneousAllCaseOptimal","t":"Transforming Worst-case Optimal Solutions for Simultaneous Tasks into All-case Optimal Solutions","u":"PODC2011/SimultaneousAllCaseOptimal/","v":"weakened","y":"2011"},{"a":[39,393,548],"c":"7","m":"Theorem 1 (CAS version) holds under TSO, but Lemma 2 is false as stated and safety needs a new store-buffer invariant; the read/write version (Theorem 12) was not checked.","s":"ConstantBarriersMutex","t":"An O(1)-Barriers Optimal RMRs Mutual Exclusion Algorithm","u":"PODC2013/ConstantBarriersMutex/","v":"hard","y":"2013"},{"a":[71,250,260,332],"c":"6","m":"Message bound and conditional algorithms hold; the round lower bound's proof fails for decision times and is reproved only without signatures, so tightness with signatures is weaker; an unused remark is false.","s":"BAWithPredictions","t":"Byzantine Agreement with Predictions","u":"PODC2025/BAWithPredictions/","v":"weakened","y":"2025"},{"a":[39,137,263],"c":"5","m":"Theorems 1, 2, 5, 6, 9 hold; Algorithm 2's set (Theorem 10) is refuted, and Lemma 12's gap leaves the stack impossibility unestablished; the queue impossibility was not checked.","s":"StrongLinCN2","t":"Strong Linearizability using Primitives with Consensus Number 2","u":"PODC2024/StrongLinCN2/","v":"weakened","y":"2024"},{"a":[236],"c":"5","m":"The main theorem holds: every undoable CRDT r bound hold; two proof steps need local changes, the abstract drops the body's conditions on k and n, and Observation 3 fails only from configurations never used.","s":"ScannableBinaryObjects","t":"The Space Complexity of Scannable Binary Objects","u":"PODC2021/ScannableBinaryObjects/","v":"easy","y":"2021"},{"a":[416,994],"c":"4","m":"The W2R1 algorithm is not atomic, so the fast-read condition loses its sufficiency half; Theorem 1, the fast-write impossibility, is true and proved with a new construction replacing §4.","s":"FastMWMRImpossibility","t":"Fine-grained Analysis on Fast Implementations of Distributed Multi-writer Atomic Registers","u":"PODC2020/FastMWMRImpossibility/","v":"weakened","y":"2020"},{"a":[174,895],"c":"4","m":"Register lower and upper bounds hold after local proof repairs; Theorem 4 needs a condition on the value domain, Theorem 8 a change of quantifiers, and Algorithm 2's mapping has an off-by-one.","s":"RegisterEmulationSpace","t":"Space Complexity of Fault-Tolerant Register Emulations","u":"PODC2017/RegisterEmulationSpace/","v":"easy","y":"2017"},{"a":[734,658,95],"c":"4","m":"Proposition 4's proof ignores run-time allocation and holds only for static memory; other formalized results hold, while the universal construction, the placements themselves and Section 8 are unchecked.","s":"InfiniteArrivalHierarchy","t":"Extending the Wait-free Hierarchy to Multi-Threaded Systems","u":"PODC2020/InfiniteArrivalHierarchy/","v":"weakened","y":"2020"},{"a":[71,679],"c":"4","m":"The separation of trusted hardware into two power classes is false: reliable broadcast with sequencing implements unidirectionality for all n > 2f. The positive constructions hold after small repairs.","s":"TrustedHardwareUnidirectional","t":"Brief Announcement: Classifying Trusted Hardware via Unidirectional Communication","u":"PODC2021/TrustedHardwareUnidirectional/","v":"lost","y":"2021"},{"a":[50,109,516,695,741,844],"c":"4","m":"Theorem 1 holds, but its induction misses t -response fixed points.","s":"RulesOfThumb","t":"Distributed computing with rules of thumb","u":"PODC2011/RulesOfThumb/","v":"weakened","y":"2011"},{"a":[259,611],"c":"4","m":"The centralized emulator with n^{1+1/kappa} edges holds; a wrong index in Algorithm 1 and local gaps in Lemma 2.10 and Corollary 2.15 are repaired. CONGEST algorithm and spanners not checked.","s":"UltraSparseEmulators","t":"Ultra-Sparse Near-Additive Emulators","u":"PODC2021/UltraSparseEmulators/","v":"easy","y":"2021"},{"a":[343],"c":"4","m":"The separation and Theorem 6.2 hold, but the construction of Lemma 6.10 breaks regularity and needed a new invariant; Corollary 6.14 omits \"terminating\", and its CAS and LL/SC reduction was not checked.","s":"CCvsDSMSeparation","t":"A complexity separation between the cache-coherent and distributed shared memory models","u":"PODC2011/CCvsDSMSeparation/","v":"hard","y":"2011"},{"a":[123,66,889],"c":"4","m":"The formalized impossibilities and protocols hold, but the proof of Theorem 11 is broken and was replaced by a new adversary argument; Table 1 omits n > 2. Propositions 16, 17 not checked.","s":"PPNaming","t":"Brief Announcement: Space-Optimal Naming in Population Protocols","u":"PODC2018/PPNaming/","v":"hard","y":"2018"},{"a":[205],"c":"4","m":"Figure 3, the non-atomic algorithm of the title, violates k-exclusion with 3 processes and k = 1; both atomic algorithms (Theorems 8, 9) are fully proved.","s":"KBakery","t":"The k-Bakery: Local-Spin k-Exclusion Using Non-atomic Reads and Writes","u":"PODC2010/KBakery/","v":"lost","y":"2010"},{"a":[762,587],"c":"4","m":"Theorem 5.5 (PR acyclic) holds by the paper's route; Lemma 5.3's proof mishandles an empty list and needs a changed case condition; \"exactly one\" in Invariant 3.2 fails for isolated nodes.","s":"PartialReversalAcyclicity","t":"Partial Reversal Acyclicity","u":"PODC2011/PartialReversalAcyclicity/","v":"easy","y":"2011"},{"a":[435],"c":"4","m":"Algorithm 1 and all its bounds hold; AFCFS as de e Consensus Harder Than Consensus?","u":"PODC2022/RecoverableHarder/","v":"easy","y":"2022"},{"a":[141,184,323,856],"c":"3","m":"No mistakes found, but the main theorem is only partly checked: cycle simulator and impossibility proved; Robbins simulator safe on a given cycle; its liveness, the cycle's construction and complexity unchecked.","s":"FullyDefective","t":"Distributed Computations in Fully-Defective Networks","u":"PODC2022/FullyDefective/","v":"correct","y":"2022"},{"a":[145,813,823],"c":"3","m":"All approximation ratios of v2 hold; the depth bounds of the tree decompositions, the BuildIdealTD case analysis and the line-network length groups need local fixes.","s":"LineTreeScheduling","t":"Distributed Algorithms for Scheduling on Line and Tree Networks","u":"PODC2012/LineTreeScheduling/","v":"easy","y":"2012"},{"a":[39,30,631,777,943],"c":"3","m":"Theorem 8 (the auditable register) holds, but Lemma 7 needed a new simulation; the write bound becomes m + 2, Lemma 38 fails at w0 only; max-register linearizability and snapshots were not checked.","s":"AuditingWithoutLeaks","t":"Auditing without Leaks Despite Curiosity","u":"PODC2025/AuditingWithoutLeaks/","v":"hard","y":"2025"},{"a":[947,1055],"c":"3","m":"Theorem 1 (regular store-collect over the abstract MAC layer) holds; wait-freedom needs the implied assumption that handlers do not starve the main thread; the consensus algorithms were not checked.","s":"AnonymousMACConsensus","t":"Brief Announcement: Computability and Anonymous Storage-Efficient Consensus with an Abstract MAC Layer","u":"PODC2022/AnonymousMACConsensus/","v":"slip","y":"2022"},{"a":[207,362,381,739],"c":"3","m":"Maximal matching w.h.p. holds; Theorem 6.3 needed a new proof, Theorem 6.5 has load k + 1 and a repaired coverage proof; the energy bound for Delta >= 2 was not checked.","s":"WakeUpMatching","t":"Brief Announcement: Wake Up and Join Me! An Energy Efficient Algorithm for Maximal Matching in Radio Networks","u":"PODC2021/WakeUpMatching/","v":"hard","y":"2021"},{"a":[876,137],"c":"3","m":"General lower bounds (Theorems 5.4, 6.11) are false on a single star and the tight bound for stars loses its proof; all upper bounds and the single-graph lower bounds hold.","s":"RoundBasedKSetTopology","t":"K-set agreement bounds in round-based models through combinatorial topology","u":"PODC2020/RoundBasedKSetTopology/","v":"lost","y":"2020"},{"a":[1013,956],"c":"3","m":"Theorems 1 and 3 (necessary and sufficient timestamp condition) hold with new proofs; Lemma 4 and footnote 2 are false; the timestamp-size lower bound was not checked.","s":"PartialReplicationCausal","t":"Brief Announcement: Partially Replicated Causally Consistent Shared Memory","u":"PODC2018/PartialReplicationCausal/","v":"hard","y":"2018"},{"a":[436],"c":"2","m":"The Central Theorem fails only for uncountably many processors; Lemma 6.3's proof wrongly assumes order type ω and two definitions need local fixes, after which Theorems 6.7 and 6.8 hold.","s":"RelativisticComputing","t":"On Interplanetary and Relativistic Distributed Computing","u":"PODC2025/RelativisticComputing/","v":"easy","y":"2025"},{"a":[137,801],"c":"2","m":"Theorem 5.2 and the impossibilities hold, but WEC_COUNT is not in WD as defined, SD ⊊ WD needs a changed language, and the proof of PSD ⊂ PWD (Lemma 6.4) is broken and unsaved.","s":"LanguageDecidability","t":"Asynchronous Fault-Tolerant Language Decidability for Runtime Verification of Distributed Systems","u":"PODC2025/LanguageDecidability/","v":"weakened","y":"2025"},{"a":[705],"c":"2","m":"Robustness and the T_{n,n′} separation both hold: false steps in the proofs of Lemmas 15 and 16 have local repairs, and Observation 5 needs an implied hypothesis.","s":"RecoverableConsensus","t":"Determining Recoverable Consensus Numbers","u":"PODC2024/RecoverableConsensus/","v":"easy","y":"2024"},{"a":[296,726,770],"c":"2","m":"The speedup theorem and all numbered results hold, but the claim that binary consensus does not speed up approximate agreement holds only for id-and-round inputs, with a bound sometimes one round short.","s":"AsyncSpeedup","t":"A Speedup Theorem for Asynchronous Computation with Applications to Consensus and Approximate Agreement","u":"PODC2022/AsyncSpeedup/","v":"weakened","y":"2022"},{"a":[296,323,574],"c":"2","m":"Theorem 4.2's \"if\" direction is false for the printed Eq. (2) but holds once the sender's port is added; Lemma 3.2's zero–one step needs a few lines. The other checked results hold.","s":"RandomizedSymmetryTopology","t":"The Topology of Randomized Symmetry-Breaking Distributed Computing","u":"PODC2021/RandomizedSymmetryTopology/","v":"easy","y":"2021"},{"a":[192,609,963],"c":"2","m":"Runtime of BFDN and the urn game hold; the reduction behind Lemma 2 fails and needed a new proof; Corollary 3.2 and Claim 1 are false as printed, with local fixes.","s":"TreeExplorationBFDN","t":"Brief Announcement: Efficient Collaborative Tree Exploration with Breadth-First Depth-Next","u":"PODC2023/TreeExplorationBFDN/","v":"hard","y":"2023"},{"a":[651,130,805],"c":"2","m":"Safety holds at n = 5f + 1; \"at least 5f + 1\" fails with fixed thresholds, repaired by n − f; latency, quasi-optimality and liveness were not checked.","s":"FastByzantineTOB","t":"Fast Byzantine Total Order Broadcast","u":"PODC2026/FastByzantineTOB/","v":"easy","y":"2026"},{"a":[17,159,461,533],"c":"2","m":"Stationary laws and Ω(km) mixing lower bound hold; Theorem 2.5's upper bound is false for small a + b; the mixing and equilibrium claims of the k-IGT dynamics are unchecked.","s":"PPGameDynamics","t":"Game Dynamics and Equilibrium Computation in the Population Protocol Model","u":"PODC2024/PPGameDynamics/","v":"weakened","y":"2024"},{"a":[61,704,808],"c":"2","m":"Universal t-PLS and the optimal acyclicity tradeoff hold; the general crossing lower-bound tool is false with identifiers and true only in anonymous networks; slips in Algorithm 1 and Proposition 16.","s":"SpaceTimeVerification","t":"Brief Announcement: Space-Time Tradeoffs for Distributed Verification","u":"PODC2016/SpaceTimeVerification/","v":"weakened","y":"2016"},{"a":[197],"c":"2","m":"All main theorems hold; Lemma 11(c) is false for j = i, repaired by a short replacement step in Lemma 12(c), and Appendix B needs local fixes.","s":"PPDoubleExpThresholds","t":"Brief Announcement: Population Protocols Decide Double-exponential Thresholds","u":"PODC2023/PPDoubleExpThresholds/","v":"easy","y":"2023"},{"a":[792,467],"c":"2","m":"All results hold (Omega(n) bound relative to the cited Israeli-Shirazi bound); the locality proof, Example 2's witness and two proof descriptions needed short local repairs.","s":"IntermediateValueLin","t":"Brief Announcement: Intermediate Value Linearizability: A Quantitative Correctness Criterion","u":"PODC2020/IntermediateValueLin/","v":"easy","y":"2020"},{"a":[393,474],"c":"2","m":"Lemma 2 and Claim 1 are false as defined and Lemmas 4, 6 and Theorem 5's proof break; all tradeoffs survive a redesign, except Theorem 4 for huge M with slow ReadMax.","s":"ReadUpdateTradeoffs","t":"Complexity Tradeoffs for Read and Update Operations","u":"PODC2014/ReadUpdateTradeoffs/","v":"hard","y":"2014"},{"a":[113,203,257,845],"c":"1","m":"Circles (k^3) holds. The ranking and TieReport protocols are wrong as printed but fixed by small rule changes; the TieSharing and Lemma 8.11 proofs needed new arguments.","s":"RankingOpinions","t":"Ranking Opinions with Few States in Population Protocols","u":"PODC2026/RankingOpinions/","v":"hard","y":"2026"},{"a":[540,573,874,978],"c":"1","m":"Deterministic characterization and protocols hold; Theorem 4.1 omits 'unregistered sender' and fails for n = 2, Figure 1 is ambiguous, two proof steps need short fixes. Randomized bounds unchecked.","s":"PartialAuthBC","t":"Byzantine Consensus in the Partially Authenticated Setting","u":"PODC2026/PartialAuthBC/","v":"easy","y":"2026"},{"a":[148,156,582,1063],"c":"1","m":"Bit sending with a relay leader is not composable, so Theorem 22 is proved only with an active leader; counting bounds, lower bound and aggregation hold. Theorems 6, 7 unchecked.","s":"ContentObliviousCounting","t":"Efficient Counting and Simulation in Content-Oblivious Rings","u":"PODC2026/ContentObliviousCounting/","v":"weakened","y":"2026"},{"a":[549],"c":"1","m":"Lemma 6 and the printed ε-BA protocol are false; a raised threshold saves Theorem 1. Proposition 4's proof fails for arbitrary protocols, but the paper's own instance has the needed property.","s":"ReachingUnivalency","t":"Reaching Univalency with Subquadratic Communication","u":"PODC2026/ReachingUnivalency/","v":"easy","y":"2026"},{"a":[285,289],"c":"1","m":"Theorems 1.2 and 1.6 hold; Lemma 5.6 fails for strings long compared with n, and proofs of Lemmas 4.5, 5.1, 5.2 need local repairs. Theorem 1.4 checked assuming cited decompositions.","s":"PLSTradeoff","t":"Near-Resolution of the Tradeoff Conjecture in Distributed PLS","u":"PODC2026/PLSTradeoff/","v":"easy","y":"2026"},{"a":[305,516],"c":"1","m":"Theorems 1.1 and 1.4 hold; proofs of Lemmas 3.1, 4.5 and A.1 need local repairs, plus a few slips. Round bounds of the (Δ+1)-colouring applications were not checked.","s":"ListDefectiveColoring","t":"Simpler and More General Distributed Coloring Based on Simple List Defective Coloring Algorithms","u":"PODC2024/ListDefectiveColoring/","v":"easy","y":"2024"},{"a":[705],"c":"1","m":"Algorithm 1 and all obstruction-free lower bounds hold; the proofs of Lemmas 13, 14, 16 and Theorem 10 need local repairs. Nondeterministic and randomized versions were not checked.","s":"ConsensusFromSwap","t":"The Space Complexity of Consensus from Swap","u":"PODC2022/ConsensusFromSwap/","v":"easy","y":"2022"},{"a":[39,137,393,734],"c":"1","m":"No mistakes found; the impossibility Theorem 11 is proved in a stronger form, but the lock-free algorithms of Theorems 4 and 7, the other half of the separation, were not formalized.","s":"LockFreeVsWaitFree","t":"Separating Loc tinctGathering/","v":"slip","y":"2026"},{"a":[188,247,716,992],"c":"1","m":"SyncBA's proofs must sign the view, and two proofs need local repairs; Theorems 3.1 (static adversary), 3.3 and 3.8 hold. Partially synchronous and QAB protocols not checked.","s":"FewToManyFaultsBA","t":"From Few to Many Faults: Optimal Adaptive Byzantine Agreement","u":"PODC2026/FewToManyFaultsBA/","v":"easy","y":"2026"},{"a":[366,930,939],"c":"1","m":"Algorithm 1 is correct: Theorems 4 and 5 hold, with a pigeonhole repair of Lemma B.2.14 and a changed additive constant. Algorithm 2 (Theorem 6) not checked.","s":"GeneralizedCAS","t":"Generalized Compare-and-Swap and Space-Efficient Universal Constructions for the Infinite-Arrival Model","u":"PODC2026/GeneralizedCAS/","v":"easy","y":"2026"},{"a":[637,797],"c":"1","m":"The binary algorithm behind Theorem 2 violates agreement (n = 5, f = 3), so O(⌈f/√n⌉) energy is unestablished. The multi-value result (Theorem 1) holds, after correcting Lemma 2 and repairing Lemma 4.","s":"EnergyEfficientAgreement","t":"Brief Announcement: Towards Energy-Efficient Distributed Agreement","u":"PODC2025/EnergyEfficientAgreement/","v":"weakened","y":"2025"},{"a":[40,160,481,518,622,728],"c":"1","m":"Rapid Download (Algorithm 7) fails for f = 2, leaving Theorem 5.16 unestablished; Theorem 3.6 and Static Download (Theorem 5.9) hold. The randomized Byzantine and asynchronous protocols were not checked.","s":"ByzantineDownload","t":"Brief Announcement: Distributed Download from an External Data Source in Byzantine Majority Settings","u":"PODC2025/ByzantineDownload/","v":"weakened","y":"2025"},{"a":[735,809,883,1012],"c":"1","m":"Upper and lower bounds hold with C = 1/ζ(α). Proofs of Propositions 3 and 4 and Theorem 3 need local repairs; Proposition 4 fails only for c ≥ n, Theorem 3 needs large n.","s":"PowerLawLabeling","t":"Near-Optimal Adjacency Labeling Scheme for Power-Law Graphs","u":"PODC2016/PowerLawLabeling/","v":"easy","y":"2016"},{"a":[294,463,747,912],"c":
