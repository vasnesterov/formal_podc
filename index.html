 change to its failure model, and multi-register scans need a local argument. Θ(f) tightness for TAS unchecked.","s":"RecoverableHierarchy","t":"Brief Announcement: The Recoverable Consensus Hierarchy","u":"PODC2019/RecoverableHierarchy/","v":"easy","y":"2019"},{"a":[983,997,535],"c":"1","m":"The d + min{ε, u, d/3} bounds hold; the (1 - 1/k)u bound is proved only under a stronger hypothesis, and the push + peek entry has no proof. The upper bounds were not checked.","s":"SharedObjectTimeBounds","t":"Time Bounds for Shared Objects in Partially Synchronous Systems","u":"PODC2011/SharedObjectTimeBounds/","v":"weakened","y":"2011"},{"a":[468,478],"c":"1","m":"KKβ is safe, wait-free and has effectiveness n - 2m + 2; Theorem 4.4's equality holds only at f = m - 1, a local correction. Work complexity, IterativeKK and Write-All unchecked.","s":"AtMostOnceEffectiveness","t":"Solving the At-Most-Once Problem with Nearly Optimal Effectiveness","u":"PODC2011/AtMostOnceEffectiveness/","v":"easy","y":"2011"},{"a":[39,520,891,997],"c":"1","m":"CCC is not regular: a 5-node run without churn or crashes refutes Theorem 6 and Corollary 7, and no repair is proved. The snapshot over any regular store-collect and the churn arithmetic hold.","s":"StoreCollectChurn","t":"Brief Announcement: Collect in the Presence of Continuous Churn with Application to Snapshots and Lattice Agreement","u":"PODC2020/StoreCollectChurn/","v":"lost","y":"2020"},{"a":[435],"c":"1","m":"Durable linearizability, detectability and constant time hold under a per-process recovery rule, not the stated per-object one; the proof needed a new invariant and a refinement. Space bound not formalized.","s":"DuraCAS","t":"Brief Announcement: Efficient Recoverable Writable-CAS","u":"PODC2023/DuraCAS/","v":"hard","y":"2023"},{"a":[39,291,997],"c":"0","m":"Lower bounds and gather results stand. Corollary 10's broadcast proof covers only n > 4f and needed a new direct argument; the abstract's n > 5f boundary must exclude broadcast.","s":"CanonicalRoundByzantine","t":"Why Canonical-Round Algorithms Fail for Optimal Byzantine Resilience","u":"PODC2026/CanonicalRoundByzantine/","v":"hard","y":"2026"},{"a":[202,18,677,595],"c":"0","m":"All closed-form fixation laws stand, Proposition 6 with new proofs and Theorem 7 with a repaired definition. Theorem 1's O(log n) convergence time rests on an invalid proof and stays unproved.","s":"OrderStatisticsPP","t":"Order Statistics in Population Protocols via Simple Dynamics","u":"PODC2026/OrderStatisticsPP/","v":"weakened","y":"2026"},{"a":[691],"c":"0","m":"Only slips. The deterministic algorithm is correct in O(log_δ n) LOCAL rounds; the CONGEST implementation of the repair step, the randomized bound and the cited lower bounds were not checked.","s":"SinklessOrientation","t":"Sinkless Orientation Made Trivial","u":"PODC2026/SinklessOrientation/","v":"slip","y":"2026"},{"a":[195,208,264,561,583,643,912],"c":"0","m":"Section 5's equivalences stand after maximally T-safe views are redesigned as critical views, with local repairs to Lemmas 5.2 and 5.5. The main separation, Theorem 4.1 and its LCL Π, was not checked.","s":"LocalComputable","t":"Brief Announcement: Is a LOCAL Algorithm Computable?","u":"PODC2026/LocalComputable/","v":"hard","y":"2026"},{"a":[39,137,263],"c":"0","m":"All formalized impossibilities stand. Theorem 30's test&set case has a wrong indistinguishability step, closed by a new valency argument; Lemma 17 needs a local repair, and the rest are slips.","s":"ConsistentRefereeing","t":"Impossibility Results for Strong Linearizability: The Difficulty of Consistent Refereeing","u":"PODC2026/ConsistentRefereeing/","v":"hard","y":"2026"},{"a":[212,657],"c":"0","m":"Necessity and sufficiency of dynamic common knowledge hold in the generic model; the informal claim that every AoN protocol has such facts needs memory of decisions, and Theorem 1.7's iff needs a nonfaulty process.","s":"AgreementDCK","t":"Brief Announcement: What is Agreement About if not Common Knowledge?","u":"PODC2026/AgreementDCK/","v":"easy","y":"2026"},{"a":[540,573],"c":"0","m":"Algorithm 1 as printed never counts; one constant fixes it and O(f + 1 + log n) early stabilization is verified. Headline O(f + 1) (Theorem 1.1) and bit complexity were not checked.","s":"EarlyStabilizingCounting","t":"Early-Stabilizing Counting","u":"PODC2026/EarlyStabilizingCounting/","v":"easy","y":"2026"},{"a":[308,572,783,925],"c":"0","m":"Algorithm 1 is not wait-free for k >= 2, so the wait-free hierarchy survives only obstruction-free and for k = 1. The n-register and k + 1 lower bounds hold.","s":"StrangerFreeTasks","t":"Stranger-Free Tasks","u":"PODC2025/StrangerFreeTasks/","v":"weakened","y":"2025"},{"a":[29,526,14],"c":"0","m":"The (k - 1) 2^w construction and the k 2^w + k + 1 bound hold; the definition of poised lacks one condition, and Claim 1 misses the all-FAI case.","s":"UniqueIDsBoundedRegisters","t":"Optimal Construction of Unique Identifiers from Bounded Registers","u":"PODC2025/UniqueIDsBoundedRegisters/","v":"easy","y":"2025"},{"a":[820,350,915],"c":"0","m":"Both tight bounds hold, but the object protocol of Fig. 1 is not wait-free and needed rotating ballots, and Lemma 4's safety proof needed a new invariant; several lower-bound proofs had local gaps.","s":"TwoStepConsensusLB","t":"Brief Announcement: Revisiting Lower Bounds for Two-Step Consensus","u":"PODC2025/TwoStepConsensusLB/","v":"hard","y":"2025"},{"a":[684,915],"c":"0","m":"Characterization and all three algorithms hold after an index typo and local proof repairs. The illustrating example 'AQ is in C1.5' is false: AQ is in C2.","s":"TwoShotConsensusObjects","t":"An Exact Characterization of the Two-shot Deterministic Objects Solving Two-process Consensus","u":"PODC2025/TwoShotConsensusObjects/","v":"easy","y":"2025"},{"a":[22,193,219,226],"c":"0","m":"Unison algorithm U(K) is not self-stabilizing as printed; a one-line change of E's input repairs it with the claimed bound. Lead
